[package]
name = "poisson-spikes"
version = "0.1.0"
edition = "2021"
description = "Interactive real-time Poisson spike train simulation in Rust + egui"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "poisson-spikes"
path = "src/main.rs"

[dependencies]
egui = "0.31"
egui_plot = "0.31"

# Desktop (Linux/macOS/Windows) dependencies for `cargo run -p poisson-spikes`
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = { version = "0.31", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
fastrand = "2"

# Browser (WebAssembly) dependencies for `npm run build:wasm`
[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { version = "0.31", default-features = false, features = [
    "default_fonts",
    "glow",
] }
fastrand = { version = "2", features = ["js"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Document",
    "Element",
    "HtmlCanvasElement",
    "MediaQueryList",
    "Window",
] }
